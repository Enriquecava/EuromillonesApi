name: CI

on:
  pull_request:
    branches: [ main, devel ]
  push:
    branches: [ main, devel ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    - name: Install dependencies
      run: |
        gem install bundler
        bundle install

    - name: Run RSpec tests
      env:
        APP_ENV: test
        LOG_LEVEL: error
      run: bundle exec rspec --format progress --format RspecJunitFormatter --out tmp/rspec_results.xml

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rspec-results
        path: tmp/rspec_results.xml

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get -yqq install libpq-dev

    - name: Install dependencies
      run: |
        gem install bundler
        bundle config set --local deployment false
        bundle config set --local path vendor/bundle
        bundle install --jobs 4 --retry 3

    - name: Check Ruby syntax
      run: |
        find . -name "*.rb" -not -path "./vendor/*" -exec ruby -c {} \;

    - name: Security audit
      run: |
        gem install bundler-audit
        bundle audit --update

  # Branch protection job
  branch_protection:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [test, lint]
    
    steps:
    - name: Check branch protection requirements
      run: |
        echo "🔍 Checking branch protection for target: ${{ github.base_ref }}"
        if [[ "${{ github.base_ref }}" == "main" || "${{ github.base_ref }}" == "devel" ]]; then
          echo "✅ Protected branch check passed for ${{ github.base_ref }}"
          echo "🛡️ All required checks completed successfully"
        else
          echo "ℹ️ Target branch ${{ github.base_ref }} is not protected"
        fi
        
    - name: Validate PR requirements
      if: contains(fromJson('["main", "devel"]'), github.base_ref)
      run: |
        echo "🔒 Validating PR requirements for protected branch: ${{ github.base_ref }}"
        echo "✅ Tests passed: ${{ needs.test.result }}"
        echo "✅ Lint passed: ${{ needs.lint.result }}"
        echo "🎉 All protection requirements met!"