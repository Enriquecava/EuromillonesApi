name: CI - Tests and Quality Checks

on:
  # Run on pull requests targeting main or devel branches
  pull_request:
    branches: [ main, devel ]
    types: [ opened, synchronize, reopened ]
  
  # Run on pushes to main or devel branches
  push:
    branches: [ main, devel ]

  # Allow manual workflow runs
  workflow_dispatch:

env:
  RUBY_VERSION: '3.4'
  RACK_ENV: test
  APP_ENV: test
  PG_HOST: ${{ secrets.PG_HOST }}
  PG_PORT: ${{ secrets.PG_PORT }}
  PG_DB: ${{ secrets.PG_DB }}
  PG_USER: ${{ secrets.PG_USER }}
  PG_PASSWORD: ${{ secrets.PG_PASSWORD }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    # Set up PostgreSQL service for tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: euromillones_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up test database environment
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DB: euromillones_test
          PG_USER: postgres
          PG_PASSWORD: postgres
        run: |
          echo "Database connection configured for tests"

      - name: Check Ruby syntax
        run: |
          echo "🔍 Checking Ruby syntax..."
          bundle exec rake ci:syntax

      - name: Run security audit
        run: |
          echo "🔒 Running security audit..."
          bundle exec rake ci:security

      - name: Run full test suite
        run: |
          echo "🧪 Running full test suite..."
          bundle exec rake ci:test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tmp/rspec_results.xml
          retention-days: 7

  quality_checks:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Check for merge conflicts
        run: |
          echo "🔍 Checking for merge conflict markers..."
          
          # Create temporary patterns to avoid self-detection
          HEAD_PATTERN="<<<<<<<[[:space:]]HEAD"
          SEP_PATTERN="======="
          END_PATTERN=">>>>>>>"
          
          # Check for conflict markers, excluding this workflow file
          CONFLICTS=$(find . -name "*.rb" -o -name "*.yml" -o -name "*.yaml" -o -name "*.json" | \
                     grep -v vendor/ | grep -v node_modules/ | grep -v ".git/" | \
                     xargs grep -l "$HEAD_PATTERN\|$SEP_PATTERN\|$END_PATTERN" 2>/dev/null | \
                     grep -v ".github/workflows/ci.yml" || true)
          
          if [ -n "$CONFLICTS" ]; then
            echo "❌ Merge conflict markers found in:"
            echo "$CONFLICTS"
            exit 1
          else
            echo "✅ No merge conflict markers found"
          fi

      # Trailing whitespace check disabled for existing codebase
      # Uncomment when ready to clean up whitespace across the project
      # - name: Check for trailing whitespace
      #   run: |
      #     echo "🔍 Checking for trailing whitespace..."
      #     if grep -r "[[:space:]]$" --include="*.rb" --include="*.yml" --include="*.yaml" --include="*.json" --exclude-dir=vendor --exclude-dir=node_modules --exclude-dir=.git .; then
      #       echo "❌ Files with trailing whitespace found!"
      #       exit 1
      #     else
      #       echo "✅ No trailing whitespace found"
      #     fi

      - name: Validate YAML files
        run: |
          echo "🔍 Validating YAML files..."
          find . -name "*.yml" -o -name "*.yaml" | grep -v vendor/ | grep -v node_modules/ | while read file; do
            if ! ruby -ryaml -e "YAML.load_file('$file')" 2>/dev/null; then
              echo "❌ Invalid YAML: $file"
              exit 1
            fi
          done
          echo "✅ All YAML files are valid"

      - name: Validate JSON files
        run: |
          echo "🔍 Validating JSON files..."
          find . -name "*.json" | grep -v vendor/ | grep -v node_modules/ | while read file; do
            if ! ruby -rjson -e "JSON.parse(File.read('$file'))" 2>/dev/null; then
              echo "❌ Invalid JSON: $file"
              exit 1
            fi
          done
          echo "✅ All JSON files are valid"

  notify_status:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [test, quality_checks]
    if: always()
    
    steps:
      - name: Check overall status
        run: |
          if [[ "${{ needs.test.result }}" == "success" && "${{ needs.quality_checks.result }}" == "success" ]]; then
            echo "✅ All checks passed! Ready for review/merge."
          else
            echo "❌ Some checks failed. Please review the logs."
            exit 1
          fi